<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背包排布 · 精确求解</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f3eee4;
    --paper-deep: #e8e0d0;
    --card: #fbf8f2;
    --ink: #1f1c17;
    --ink-soft: #5d574c;
    --rule: #cfc5b2;
    --accent: #c4402a;
    --accent-ink: #fff8f0;
    --ok: #2f6b3f;
    --shadow: 0 1px 0 #fff inset, 0 10px 30px -18px rgba(40, 30, 10, .45);
    --radius-s: 4px;
    --radius-l: 14px;
    --font-sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-display: "Iowan Old Style", "Palatino Linotype", "Songti SC", "SimSun", Georgia, serif;
    --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, ui-monospace, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 15px/1.5 var(--font-sans);
    background:
      radial-gradient(circle at 1px 1px, rgba(31, 28, 23, .07) 1px, transparent 0) 0 0 / 18px 18px,
      linear-gradient(180deg, var(--paper), var(--paper-deep));
    min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .masthead {
    display: flex; align-items: end; justify-content: space-between; gap: 24px;
    max-width: 1320px; margin: 0 auto; padding: 36px 32px 18px;
    border-bottom: 2px solid var(--ink);
  }
  .kicker { margin: 0; font: 600 11px/1 var(--font-mono); letter-spacing: .28em; color: var(--accent); }
  h1 { margin: 6px 0 0; font: 700 44px/1 var(--font-display); letter-spacing: .02em; }
  h1 small { font: 400 15px var(--font-sans); color: var(--ink-soft); margin-left: 14px; letter-spacing: 0; }
  h2 { margin: 0; font: 700 22px/1.2 var(--font-display); }
  .file-actions { display: flex; gap: 8px; }

  .btn {
    border: 1.5px solid var(--ink); background: var(--card); border-radius: var(--radius-s);
    padding: 7px 14px; cursor: pointer; transition: transform .15s var(--ease), background .15s;
  }
  .btn:hover { background: #fff; transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn.link { white-space: nowrap; border-color: transparent; background: none; color: var(--ink-soft); font-size: 13px; padding: 4px 8px; }
  .btn.link:hover { color: var(--ink); background: none; text-decoration: underline; }
  .btn.primary {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    padding: 11px 26px; font-weight: 700; letter-spacing: .08em; box-shadow: 0 6px 0 -2px #8e2a1a;
  }
  .btn.primary:hover { background: #d24a33; }
  .btn.primary.cancel { background: var(--ink); border-color: var(--ink); box-shadow: 0 6px 0 -2px #000; }
  .btn.primary:disabled { background: var(--ink-soft); border-color: var(--ink-soft); box-shadow: none; cursor: progress; transform: none; }

  .desk {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 36px;
    max-width: 1320px; margin: 0 auto; padding: 32px 32px 72px; align-items: start;
  }
  @media (max-width: 1280px) { /* the item table needs ~640px beside the board: stack below this */
    .desk { grid-template-columns: 1fr; }
  }
  .card { background: var(--card); border: 1.5px solid var(--ink); border-radius: var(--radius-l); box-shadow: var(--shadow); }

  .board-card { padding: 26px 32px 32px; }
  /* keep the board in view beside the item list; only in two columns, where nothing is below it */
  @media (min-width: 1281px) { .board-card { position: sticky; top: 16px; } }
  .board-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
  .dims { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); }
  .dims input { width: 54px; padding: 4px 6px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); background: #fff; text-align: center; }
  .hint { color: var(--ink-soft); font-size: 13px; }

  .board-wrap { overflow-x: auto; padding: 4px 2px 10px; container-type: inline-size; }
  .board {
    --cell: min(72px, calc((100cqw - 6px) / var(--cols))); /* as large as the card allows */
    display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); gap: 0;
    width: max-content; border: 2.5px solid var(--ink); background: #fff;
  }
  .cell {
    width: var(--cell); height: var(--cell); border: 0; padding: 0; margin: 0; position: relative;
    background: #fff; box-shadow: inset 0 0 0 .5px var(--rule); cursor: pointer;
    transition: filter .15s;
  }
  .cell:hover { filter: brightness(.94); }
  .board.locked .cell { cursor: default; }
  .board.locked .cell:hover { filter: none; }
  .cell.blocked {
    background: repeating-linear-gradient(45deg, var(--ink) 0 3px, #3a352c 3px 9px);
    background-attachment: fixed;
  }
  .cell.piece {
    background: repeating-linear-gradient(-45deg, #ece4d4 0 6px, #ded3bf 6px 12px);
    background-attachment: fixed; /* one stripe field for the whole page, so the two halves join seamlessly */
  }
  .cell .tag {
    position: absolute; left: 6px; top: 5px; right: 4px; text-align: left; pointer-events: none;
    font: 700 clamp(9px, calc(var(--cell) * .2), 12px)/1.15 var(--font-mono); color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .25);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell .tag small { display: block; font: 500 clamp(8px, calc(var(--cell) * .17), 10px)/1.2 var(--font-sans); opacity: .9; }
  .cell.piece .tag { color: var(--ink-soft); text-shadow: none; font-weight: 600; font-size: clamp(8px, calc(var(--cell) * .16), 11px); }
  .cell .tag.info { font-weight: 600; font-size: clamp(8px, calc(var(--cell) * .16), 11px); line-height: 1.3; opacity: .92; }
  .cell .tag.info i { font-style: normal; opacity: .8; margin-right: 2px; }
  .breakdown .bonus small { display: block; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .solve-bar { display: flex; align-items: center; gap: 12px 20px; margin-top: 24px; flex-wrap: wrap; }
  .fast-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
  .fast-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .fast-toggle small { color: var(--ink-soft); }
  .status { font: 13px var(--font-mono); color: var(--ink-soft); }
  .status.ok { color: var(--ok); font-weight: 700; }
  .status.err { color: var(--accent); font-weight: 700; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 12px; margin-top: 26px; padding-top: 20px; border-top: 1.5px dashed var(--rule); }
  .total[hidden] { display: none; }
  .total .num { font: 700 56px/1 var(--font-display); }
  .total .lbl { font-size: 13px; color: var(--ink-soft); }
  .total .totals { flex-basis: 100%; } /* the proof badge wraps onto its own line */
  .total .proof { font: 600 12px var(--font-mono); color: var(--ok); border: 1.5px solid var(--ok); padding: 3px 8px; border-radius: 999px; }
  .total .proof.approx { color: #9a6200; border-color: #c98a1a; } /* amber: a good layout, not a proven one */

  table { width: 100%; border-collapse: collapse; }
  .breakdown { margin-top: 18px; font-size: 13px; }
  .breakdown th { text-align: left; font: 600 11px var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); border-bottom: 1.5px solid var(--ink); padding: 8px 6px; }
  .breakdown td { padding: 9px 6px; border-bottom: 1px solid var(--rule); }
  .breakdown td.num { font-family: var(--font-mono); text-align: right; }
  .breakdown th.num { text-align: right; }
  .breakdown .plus { color: var(--ok); }
  .chip { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .items-card { padding: 26px 0 14px; }
  .items-card > header { padding: 0 32px 8px; display: flex; align-items: baseline; justify-content: space-between; }
  .count { font: 12px var(--font-mono); color: var(--ink-soft); }
  .head-tools { display: flex; align-items: baseline; gap: 12px; }
  .btn.clear, .btn.board-edit { padding: 3px 10px; font-size: 12px; }
  .btn.board-edit { margin-left: auto; }
  .btn.board-edit[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .status .undo { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .btn.edit-toggle { margin-left: auto; letter-spacing: normal; font-family: var(--font-sans); padding: 6px 16px; font-size: 14px; font-weight: 700; border-color: var(--accent); color: var(--accent); background: #fff; box-shadow: 0 3px 0 -1px var(--accent); }
  .btn.edit-toggle:hover { background: #fbe9e4; }
  .btn.edit-toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 -1px #8f2c1c; }
  .head-tools { align-items: center; }
  .head-tools .btn, .head-tools .count, .items-card > header h2 { white-space: nowrap; }
  .btn.clear:disabled { opacity: .4; cursor: default; }
  .item-list > summary { display: flex; align-items: center; gap: 12px; padding: 14px 32px 8px; cursor: pointer; font: 600 11px var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); list-style: none; }
  .item-list > summary::-webkit-details-marker { display: none; }
  .item-list > summary::before { content: "▾"; display: inline-block; margin-right: 6px; transition: transform .15s; }
  .item-list:not([open]) > summary::before { transform: rotate(-90deg); }
  .item-list > summary:hover { color: var(--ink); }
  .palette-label { margin: 12px 32px 0; font-size: 13px; color: var(--accent); font-weight: 600; }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; padding: 10px 32px 20px; }
  .palette .custom { position: relative; display: grid; }
  .palette .custom .x { position: absolute; top: 2px; right: 2px; border: 0; background: none; color: var(--ink-soft); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .palette .custom .x:hover { color: var(--accent); background: #f4e1dc; }
  .shape-btn.add b { font-size: 22px; line-height: 44px; }
  .shape-editor { border: 1.5px solid var(--ink); border-radius: 12px; padding: 20px 22px; background: var(--paper, #fff); }
  .shape-editor::backdrop { background: rgba(0, 0, 0, .35); }
  .shape-editor h3 { margin: 0 0 4px; }
  .shape-editor p { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); }
  .draw-grid { display: grid; grid-template-columns: repeat(3, 48px); gap: 4px; justify-content: center; margin-bottom: 12px; }
  .draw-grid button { width: 48px; height: 48px; border: 1.5px solid var(--rule); border-radius: 6px; background: #fff; cursor: pointer; }
  .draw-grid button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
  .shape-editor .err { color: var(--accent); min-height: 1.2em; }
  .shape-editor menu { display: flex; justify-content: flex-end; gap: 8px; margin: 0; padding: 0; }
  .presets { padding: 0 32px 22px; border-bottom: 1.5px solid var(--ink); }
  .presets h3 { margin: 0 0 10px; font: 600 11px var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); }
  .preset-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .preset-list .empty-note { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .group-save { display: flex; gap: 10px; margin-bottom: 12px; }
  .group-save input { flex: 1; width: 0; min-width: 0; padding: 6px 8px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); background: #fff; }
  .group-save .btn { padding: 6px 12px; white-space: nowrap; }
  .preset { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 26px 6px 8px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--rule); border-radius: 8px; text-align: left;
    transition: border-color .15s, transform .15s var(--ease); }
  .preset:hover { border-color: var(--ink); transform: translateY(-1px); }
  .preset .icons { display: flex; gap: 2px; flex: none; }
  .preset .icons svg { width: 18px; height: 13px; }
  .preset b { display: block; font-size: 13px; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preset small { display: block; font: 11px var(--font-mono); color: var(--ink-soft); }
  .preset .x { position: absolute; top: 2px; right: 4px; border: 0; background: none; color: var(--ink-soft); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .preset .x:hover { color: var(--accent); background: #f4e1dc; }

  .shape-btn {
    display: grid; justify-items: center; gap: 6px; padding: 12px 4px 8px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--rule); border-radius: 10px;
    transition: transform .18s var(--ease), border-color .18s, box-shadow .18s;
  }
  .shape-btn:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 8px 16px -10px rgba(0, 0, 0, .5); }
  .shape-btn:active { transform: translateY(0); }
  .shape-btn b { font: 700 15px var(--font-mono); }
  .shape-btn svg { height: 44px; width: 100%; } /* viewBox keeps the aspect: long shapes shrink to fit */

  .items { font-size: 14px; }
  .items th { text-align: left; font: 600 11px var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); padding: 10px 6px; }
  .items th:first-child, .items td:first-child { padding-left: 32px; }
  .items th:last-child, .items td:last-child { padding-right: 18px; }
  .items td { padding: 10px 4px; border-top: 1px solid var(--rule); vertical-align: middle; }
  .items td.attr input { min-width: 50px; padding: 5px 4px; text-align: right; -moz-appearance: textfield; appearance: textfield; } /* fits -999 */
  .items td.attr input::-webkit-inner-spin-button, .items td.attr input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; } /* spinners ate ~15px */
  .items tbody tr { transition: background .15s; }
  .items tbody tr:hover { background: #fff; }
  .items input[type=text], .items input[type=number], .items select {
    width: 100%; padding: 5px 7px; border: 1.5px solid transparent; border-radius: var(--radius-s); background: transparent;
  }
  .items input:hover, .items select:hover { border-color: var(--rule); background: #fff; }
  .items input:focus, .items select:focus { border-color: var(--ink); background: #fff; outline: none; }
  .items input[type=number] { font-family: var(--font-mono); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .items td.shape { padding-right: 0; }
  .shape-toggle { display: grid; place-items: center; width: 48px; height: 36px; padding: 0; border: 1.5px solid transparent; border-radius: var(--radius-s); background: none; cursor: pointer; }
  .shape-toggle:hover { border-color: var(--rule); background: #fff; }
  .shape-toggle svg { width: 40px; height: 28px; } /* fixed box; viewBox centers any shape inside */
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; padding-left: 8px; }
  .used { font: 11px var(--font-mono); color: var(--ok); white-space: nowrap; }
  .used.none { color: var(--ink-soft); }
  .chip-tag { font: 600 11px/1.6 var(--font-sans); padding: 0 7px; border: 1px solid transparent; border-radius: 999px; background: var(--paper-deep); color: var(--ink-soft); white-space: nowrap; cursor: pointer; }
  .chip-tag:hover { border-color: currentColor; }
  .chip-tag.add { background: none; border: 1px dashed var(--rule); font-weight: 500; }
  .chip-tag.add:hover { border-color: var(--ink); color: var(--ink); }
  .chip-tag.side { background: #f6ddd6; color: var(--accent); }
  .chip-tag.must { background: var(--ink); color: var(--card); }
  .items td.more { text-align: right; }
  .more-btn { display: inline-flex; align-items: center; gap: 3px; height: 28px; padding: 0 8px 0 10px; border: 1.5px solid var(--rule); border-radius: 999px; background: none; color: var(--ink-soft); cursor: pointer; font-size: 12px; }
  .more-btn:hover { border-color: var(--ink); color: var(--ink); background: #fff; }
  .more-btn .chev { display: inline-block; font-size: 14px; line-height: 1; transition: transform .2s var(--ease); }
  .more-btn[aria-expanded="true"] { border-color: var(--ink); color: var(--ink); background: #fff; }
  .more-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .items tr.open, .items tr.detail { background: #fff; } /* on the row: no seams between cells */
  /* locked (not editing): fields read as plain text and the whole row opens the bonuses */
  .items tr.locked { cursor: pointer; }
  .items tr.locked input[readonly], .items tr.locked select:disabled {
    border-color: transparent !important; background: transparent !important; color: var(--ink); opacity: 1;
    pointer-events: none; /* plain text: no caret, and the click falls through to the row */
  }
  .items tr.locked select:disabled { appearance: none; -webkit-appearance: none; padding-right: 4px; }
  .items tr.locked:hover:not(.open) { background: #fff; }
  /* editing: every field shows its box, so it is plain what can be typed into */
  .items tr.item:not(.locked) input:not([type=checkbox]), .items tr.item:not(.locked) select { border-color: var(--rule); background: #fff; }
  .items tr.item > td:first-child { box-shadow: inset 4px 0 0 var(--row-color); transition: box-shadow .15s; } /* same color as on the board */
  .items tr.item.hl { background: #fff; }
  .items tr.item.hl > td:first-child { box-shadow: inset 7px 0 0 var(--row-color); }
  .items tr.unused { opacity: .5; transition: opacity .15s; } /* left out of the last solution */
  .items tr.unused:hover, .items tr.unused.open { opacity: 1; }
  .bar { height: 3px; margin: 3px 4px 0; border-radius: 2px; background: linear-gradient(to left, var(--row-color) var(--w), var(--rule) var(--w)); opacity: .85; }
  .bar.neg { background: linear-gradient(to left, var(--accent) var(--w), var(--rule) var(--w)); }
  .final { margin-top: 3px; padding-right: 4px; text-align: right; font: 600 11px var(--font-mono); color: var(--ok); white-space: nowrap; }
  .final.neg { color: var(--accent); }
  .board.focus .cell[data-row]:not(.hl) { filter: saturate(.2) opacity(.45); }
  .items tr.detail > td { padding: 2px 18px 18px 32px; border-top: 0; }
  .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 12px 16px; border: 1.5px dashed var(--rule); border-radius: var(--radius-s); }
  .field { display: flex; flex: none; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .field > span { color: var(--ink-soft); font: 600 11px var(--font-mono); letter-spacing: .12em; }
  .field small { color: var(--ink-soft); font-size: 11px; }
  .field select { padding: 4px 8px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); background: #fff; font: 700 13px var(--font-mono); }
  .field.check { cursor: pointer; user-select: none; }
  .field.check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .sides { display: grid; grid-template-columns: repeat(2, 26px); gap: 4px; }
  .sides.row { grid-template-columns: repeat(4, 30px); }
  .sides button { height: 26px; padding: 0; font-size: 12px; line-height: 1; cursor: pointer; border: 1.5px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink-soft); }
  .sides button:hover { border-color: var(--ink); color: var(--ink); }
  .sides button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .type-pick { display: flex; align-items: center; gap: 4px; }
  .type-pick select { width: auto; padding: 4px 4px; font: 700 13px var(--font-mono); }
  .items td.more { white-space: nowrap; }
  .del { width: 28px; height: 32px; border: 0; background: none; cursor: pointer; color: var(--ink-soft); font-size: 18px; line-height: 1; border-radius: var(--radius-s); }
  .del:hover { color: var(--accent); background: #f4e1dc; }
  .empty { padding: 26px; margin: 0; color: var(--ink-soft); text-align: center; }
  .empty[hidden] { display: none; }

  /* goal: one row per attribute with a 3-way switch */
  .goal { display: grid; gap: 8px; margin-top: 18px; }
  .goal-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .goal-row > b { width: 34px; font-size: 14px; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: var(--radius-s); overflow: hidden; }
  .seg button { border: 0; border-left: 1.5px solid var(--ink); background: var(--card); padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed=true] { background: var(--ink); color: var(--accent-ink); font-weight: 700; }
  .seg button:disabled { color: var(--rule); cursor: not-allowed; }
  .goal-row input { width: 86px; padding: 4px 6px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); font-family: var(--font-mono); }
  .goal-row .hint { font-size: 12px; }
  .goal-note { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }

  .totals { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .totals .main .num { font: 700 56px/1 var(--font-display); }
  .totals .sub .num { font: 700 26px/1 var(--font-display); }
  .totals .lbl { font-size: 13px; color: var(--ink-soft); margin-left: 4px; }
  .totals .met { font: 600 12px var(--font-mono); color: var(--ok); margin-left: 4px; }
  .totals .skip { opacity: .4; }
  .total .proof { margin-left: 0; }
  .infeasible { border: 1.5px solid var(--accent); border-radius: var(--radius-s); padding: 12px 14px; color: var(--accent); font-size: 14px; width: 100%; }

<body>
<header class="masthead">
  <div>
    <p class="kicker">2D KNAPSACK · EXACT SOLVER</p>
    <h1>背包排布<small>全局最优 · 可证明</small></h1>
  </div>
  <nav class="file-actions" aria-label="文件">
    <button class="btn link" id="importBtn" type="button" title="可选：从文件载入之前保存的配置">导入</button>
    <button class="btn link" id="exportBtn" type="button" title="可选：把当前配置保存成文件">导出</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </nav>
</header>

<main class="desk">
  <section class="card board-card" aria-labelledby="board-h">
    <div class="board-head">
      <h2 id="board-h">棋盘</h2>
      <div class="dims">

        <label>高 <input id="h" type="number" min="1" max="12"></label>
      </div>
      <span class="hint" id="boardHint">点击格子切换禁用格</span>
      <button class="btn board-edit" id="boardEditBtn" type="button" aria-pressed="false" hidden>✎ 修改禁用格</button>
    </div>
    <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="棋盘"></div></div>
    <div class="goal" id="goal" role="group" aria-label="求解目标"></div>
    <div class="solve-bar">
      <button class="btn primary" id="solveBtn" type="button">求最优解</button>
      <label class="fast-toggle"><input type="checkbox" id="fastMode"> 快速模式 <small>近似解，几秒出结果</small></label>
      <span class="status" id="status" role="status"></span>
    </div>
    <div class="total" id="total" hidden></div>
    <div class="breakdown" id="breakdown"></div>
  </section>

  <section class="card items-card" aria-labelledby="items-h">
    <header><h2 id="items-h">物品</h2><span class="head-tools"><span class="count" id="count"></span><button class="btn clear" id="clearBtn" type="button">清空物品</button></span></header>
    <p class="palette-label">点击形状添加物品 ↓</p>
    <div class="palette" id="palette" aria-label="添加物品"></div>
    <section class="presets" aria-labelledby="presets-h">
      <h3 id="presets-h">我的预设组</h3>
      <form class="group-save" id="groupSave">
        <input id="groupName" type="text" maxlength="40" placeholder="组名，如：主力配置" aria-label="预设组名称">
        <button class="btn" type="submit">保存当前物品</button>
      </form>
      <div class="preset-list" id="presets"></div>
    </section>
    <details class="item-list" id="itemList" open>
    <summary><span>物品列表</span><button class="btn edit-toggle" id="editBtn" type="button" aria-pressed="false" title="打开后可以修改形状、名称、属性和数量">✎ 编辑</button></summary>
    <table class="items">
      <thead><tr><th style="width:124px">形状</th><th style="width:140px">名称</th><th class="attr">性能</th><th class="attr">质量</th><th class="attr">效率</th><th class="attr qty">数量</th><th><span class="sr">设置与删除</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="emptyHint">点击上方形状添加物品</p>
    </details>
  </section>
  <dialog class="shape-editor" id="shapeEditor" aria-labelledby="shape-editor-h">
    <form method="dialog" id="shapeForm">
      <h3 id="shape-editor-h">自定义形状</h3>
      <p>点格子画出形状（最大 3×3，格子要连在一起）。旋转、翻转都会自动尝试。</p>
      <div class="draw-grid" id="drawGrid"></div>
      <p class="err" id="drawErr" role="alert"></p>
      <menu>
        <button class="btn" type="button" id="drawCancel">取消</button>
        <button class="btn primary" type="submit">添加物品</button>
      </menu>
    </form>
  </dialog>
</main>
<footer class="colophon">
  所有计算都在你的浏览器本地完成（WebAssembly 多线程），数据不会上传。快速模式通常几秒出结果；精确模式在物品多、达标条件多或属性有负值时，可能要几分钟。
</footer>

<script type="module">
const STORE = "knapsack-ui-v1";
const MAX_SIDE = 12, MAX_QTY = 255;
const MAX_ITEMS = 5000; // the solver drops items that can't matter; exact mode then takes 63, fast mode 255
const COLORS = { U: "#2f6690", F: "#c8553d", L: "#4f7d4e", T: "#7b4b94", O: "#b8860b", V: "#2f8582", I: "#a23b72" };
const CUSTOM_COLORS = ["#5c6b73", "#8a6d3b", "#3d5a80", "#9c4f2e", "#4a7c59", "#6d4c7d"];
// border sides, laid out as a 2x2 grid; picking one drops its opposite (top/bottom, left/right)
const SIDES = [["top", "上"], ["bottom", "下"], ["left", "左"], ["right", "右"]];
const OPPOSITE = { top: "bottom", bottom: "top", left: "right", right: "left" };
/** "top", ["top", "left"], "" or undefined -> a list of sides. */
const toSides = (b) => (Array.isArray(b) ? b : b ? [b] : []).filter((x) => OPPOSITE[x]);
// attribute index -> [JSON name, label, item field]
const ATTRS = [["performance", "性能", "perf"], ["quality", "质量", "qual"], ["efficiency", "效率", "eff"]];
const $ = (s) => document.querySelector(s);

// Built-in shapes; must match SHAPES in solver-rs/src/problem.rs.
const SHAPES = {
  U: [[0, 0], [1, 0], [2, 0], [0, 1], [2, 1]],
  F: [[0, 0], [1, 0], [2, 0], [1, 1], [2, 1]],
  L: [[0, 0], [1, 0], [2, 0], [0, 1]],
  T: [[0, 0], [1, 0], [2, 0], [1, 1]],
  O: [[0, 0], [1, 0], [0, 1], [1, 1]],
  V: [[0, 0], [1, 0], [0, 1]],
  I: [[0, 0], [1, 0], [2, 0], [3, 0]],
};

/* ---------- custom shapes: drawn on a 3x3 grid, named X1, X2, ... and kept in this browser ---------- */
const SHAPE_STORE = "knapsack-shapes-v1";
const DRAW_SIDE = 3;
let customShapes = loadCustomShapes(); // [{ name, cells }]

function loadCustomShapes() {
  try {
    const list = JSON.parse(localStorage.getItem(SHAPE_STORE));
    if (Array.isArray(list)) return list.filter((c) => c && typeof c.name === "string" && Array.isArray(c.cells) && c.cells.length);
  } catch (e) { /* fall through */ }
  return [];
}
function saveCustomShapes() { localStorage.setItem(SHAPE_STORE, JSON.stringify(customShapes)); }
/** Cells of an item: built-in by type, otherwise its own copy (so deleting a custom shape never breaks items). */
const cellsOf = (it) => SHAPES[it.type] || it.cells || [];
function colorOf(type) {
  if (COLORS[type]) return COLORS[type];
  const n = parseInt(String(type).slice(1), 10) || 0;
  return CUSTOM_COLORS[n % CUSTOM_COLORS.length];
}
/** Moves cells to the origin, sorted by (y, x). */
function normalize(cells) {
  const mx = Math.min(...cells.map((c) => c[0])), my = Math.min(...cells.map((c) => c[1]));
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
}
/** Identity under rotation and mirroring (same idea as shape_key in solver-rs/src/geometry.rs). */
function shapeKey(cells) {
  const keys = [];
  for (let t = 0; t < 8; t++) {
    const pts = cells.map(([x0, y0]) => {
      let [x, y] = [x0, y0];
      for (let k = 0; k < t % 4; k++) [x, y] = [-y, x];
      return [t >= 4 ? -x : x, y];
    });
    keys.push(JSON.stringify(normalize(pts)));
  }
  return keys.sort()[0];
}
function connected(cells) {
  const seen = new Set([0]), stack = [0];
  while (stack.length) {
    const [x, y] = cells[stack.pop()];
    cells.forEach(([u, v], j) => {
      if (!seen.has(j) && Math.abs(u - x) + Math.abs(v - y) === 1) { seen.add(j); stack.push(j); }
    });
  }
  return seen.size === cells.length;
}
/** Type name for a shape: a built-in or existing custom one if it matches, else a new custom shape. */
function typeForShape(cells) {
  const key = shapeKey(cells);
  const builtIn = Object.keys(SHAPES).find((t) => shapeKey(SHAPES[t]) === key);
  if (builtIn) return builtIn;
  const known = customShapes.find((c) => shapeKey(c.cells) === key);
  if (known) return known.name;
  const used = new Set(customShapes.map((c) => c.name));
  let n = 1;
  while (used.has(`X${n}`)) n++;
  customShapes.push({ name: `X${n}`, cells: normalize(cells) });
  saveCustomShapes();
  return `X${n}`;
}
const customCells = (name) => customShapes.find((c) => c.name === name)?.cells;
let engine = null;        // solver worker with its thread pool, kept warm between solves
let solving = false;
let result = null;        // last solution from the solver
let resultRows = [];      // expanded item index -> row index, for the last solution
let resultGoal = null;    // goal the last solution was computed for
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && Array.isArray(s.items)) return upgrade(s);
  } catch (e) { /* fall through to default */ }
  return upgrade({ width: 7, height: 5, blocked: corners(7, 5), items: [] });
}
/** Fills fields added after a state was saved: three attributes (old "value" = performance), goal. */
function upgrade(s) {
  for (const it of s.items) {
    it.perf ??= it.value ?? 0;
    it.qual ??= 0;
    it.eff ??= 0;
    it.required ??= false;
    it.border = toSides(it.border); // was a single side ("" for none)
    delete it.value;
  }
  s.goal ??= ["max", "skip", "skip"];
  s.fast ??= true; // fast mode by default: seconds instead of minutes
  s.editing ??= false; // shape, name and attributes locked unless editing; bonuses always editable
  return s;
}
function corners(w, h) {
  const out = [];
  for (const [x, y] of [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]]) {
    if (!out.some(([a, b]) => a === x && b === y)) out.push([x, y]);
  }
  return out;
}
const sameCells = (a, b) => a.length === b.length && a.every(([x, y]) => b.some(([u, v]) => u === x && v === y));
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
let boardEdit = false;   // blocked cells may change while a result is shown
let solvedState = null;  // state as it was solved, for undo once a change drops the result

function invalidate() {
  if (result) {
    const undo = { state: solvedState, result, resultRows, resultGoal };
    result = null;
    boardEdit = false;
    setStatus("结果已清除", "");
    $("#status").append(" · ", el("button", { class: "undo", type: "button", title: "恢复到出结果时的设置和结果", onclick: () => restore(undo) }, "撤销"));
  }
  save();
  render();
}

/** Back to the settings and result of the last solve. */
function restore(undo) {
  state = upgrade(JSON.parse(undo.state));
  ({ result, resultRows, resultGoal } = undo);
  solvedState = undo.state;
  openRow = -1;
  save();
  render();
  setStatus("已撤销，恢复到出结果时的设置", "ok");
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function shapeSvg(type, unit = 12, cells = SHAPES[type] || customCells(type) || []) {
  const w = Math.max(...cells.map((c) => c[0])) + 1, h = Math.max(...cells.map((c) => c[1])) + 1;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w * unit} ${h * unit}`);
  svg.setAttribute("aria-hidden", "true");
  for (const [x, y] of cells) {
    const r = document.createElementNS(ns, "rect");
    Object.entries({ x: x * unit + 1, y: y * unit + 1, width: unit - 2, height: unit - 2, rx: 1.5, fill: colorOf(type) })
      .forEach(([k, v]) => r.setAttribute(k, v));
    svg.append(r);
  }
  return svg;
}

/* ---------- board ---------- */
function rowColor(row) {
  const it = state.items[row];
  const base = colorOf(it.type);
  const sameBefore = state.items.slice(0, row).filter((o) => o.type === it.type).length;
  const mix = [0, 22, 40, 12, 30][sameBefore % 5];
  return `color-mix(in oklab, ${base}, white ${mix}%)`;
}

/** Where a placed item's bonus comes from: border touched, number of distinct adjacent pieces. */
function bonusOf(it) {
  const row = state.items[resultRows[it.index]];
  const [w, h] = [state.width, state.height];
  const onSide = (side) => ([x, y]) => ({ top: y === 0, bottom: y === h - 1, left: x === 0, right: x === w - 1 })[side];
  const sides = row.border.filter((side) => it.cells.some(onSide(side))); // each touched side: +20%
  let adj = 0;
  if (row.adj) {
    const mine = new Set(it.cells.map(([x, y]) => `${x},${y}`));
    adj = result.pieces.filter((pc) => pc.cells.some(([x, y]) =>
      [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => mine.has(`${x + dx},${y + dy}`)))).length;
  }
  const parts = [sides.length ? "边" + (sides.length > 1 ? sides.length : "") : null, adj ? `邻${adj}` : null].filter(Boolean);
  return { sides, onSide, pct: 20 * sides.length + 10 * adj, text: parts.join("·") };
}
const ATTR_SHORT = ["性", "质", "效"];

function renderBoard() {
  const board = $("#board");
  // the cells are replaced: the one under the mouse never gets its pointerleave, so drop any highlight
  board.classList.remove("focus");
  document.querySelectorAll("#rows tr.item.hl").forEach((tr) => tr.classList.remove("hl"));
  board.style.setProperty("--cols", state.width);
  board.replaceChildren();
  const blocked = new Set(state.blocked.map(([x, y]) => `${x},${y}`));
  const owner = new Map();
  const tags = new Map();
  const infos = new Map(); // cell -> lines [label, value] (base attributes, bonus)
  const edges = new Map(); // cell -> sides that earn the border bonus
  if (result) {
    result.items.forEach((it) => {
      const id = "i" + it.index;
      it.cells.forEach(([x, y]) => owner.set(`${x},${y}`, { id, row: resultRows[it.index], color: rowColor(resultRows[it.index]) }));
      const sorted = [...it.cells].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
      const m = maxAttr(resultGoal);
      tags.set(sorted[0].join(","), m < 0 ? [it.name, null] : [String(it.values[m]), it.name]);
      // ponytail: 3+ cells per item assumed for the extra tags; a 1-2 cell custom shape just shows fewer
      const b = bonusOf(it);
      if (sorted[1]) infos.set(sorted[1].join(","), it.base.map((v, a) => [ATTR_SHORT[a], String(v)]));
      if (sorted[2] && b.pct) infos.set(sorted[2].join(","), [["", `+${b.pct}%`], ["", b.text]]);
      for (const side of b.sides) {
        it.cells.filter(b.onSide(side)).forEach(([x, y]) => edges.set(`${x},${y}`, [...(edges.get(`${x},${y}`) || []), side]));
      }
    });
    result.pieces.forEach((pc, j) => {
      pc.cells.forEach(([x, y]) => owner.set(`${x},${y}`, { id: "p" + j, piece: true }));
      const [fx, fy] = firstCell(pc.cells);
      const m = maxAttr(resultGoal);
      if (m >= 0) {
        const v = pc.values[m];
        tags.set(`${fx},${fy}`, [v > 0 ? "+" + v : String(v), null]);
      }
    });
  }
  const ink = "var(--ink)";
  for (let y = 0; y < state.height; y++) {
    for (let x = 0; x < state.width; x++) {
      const key = `${x},${y}`, o = owner.get(key);
      const cell = el("button", {
        class: "cell" + (blocked.has(key) ? " blocked" : "") + (o && o.piece ? " piece" : ""),
        type: "button", role: "gridcell",
        "aria-label": `第 ${y + 1} 行 第 ${x + 1} 列${blocked.has(key) ? "（禁用）" : ""}`,
        onclick: () => {
          if (result && !boardEdit) return setStatus("棋盘显示的是结果。要修改禁用格，请先点上方的「修改禁用格」", "err");
          toggleBlocked(x, y);
        },
      });
      if (o) {
        if (!o.piece) {
          cell.style.background = o.color;
          cell.dataset.row = o.row;
          cell.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") highlightRow(o.row); });
          cell.addEventListener("pointerleave", () => highlightRow(-1));
        }
        const same = (dx, dy) => (owner.get(`${x + dx},${y + dy}`) || {}).id === o.id;
        const sh = [];
        if (!same(0, -1)) sh.push(`inset 0 2.5px 0 ${ink}`);
        if (!same(0, 1)) sh.push(`inset 0 -2.5px 0 ${ink}`);
        if (!same(-1, 0)) sh.push(`inset 2.5px 0 0 ${ink}`);
        if (!same(1, 0)) sh.push(`inset -2.5px 0 0 ${ink}`);
        const accent = "var(--accent)";
        for (const side of edges.get(key) || []) {
          sh.unshift({ top: `inset 0 6px 0 ${accent}`, bottom: `inset 0 -6px 0 ${accent}`,
            left: `inset 6px 0 0 ${accent}`, right: `inset -6px 0 0 ${accent}` }[side]);
        }
        cell.style.boxShadow = sh.join(",") || "none";
      }
      const t = tags.get(key);
      if (t) cell.append(el("span", { class: "tag" }, t[0], t[1] ? el("small", {}, t[1]) : null));
      const info = infos.get(key);
      if (info) cell.append(el("span", { class: "tag info" }, ...info.map(([l, v]) => el("div", {}, l ? el("i", {}, l) : null, v))));
      board.append(cell);
    }
  }
}

function firstCell(cells) {
  return [...cells].sort((a, b) => a[1] - b[1] || a[0] - b[0])[0];
}

function toggleBlocked(x, y) {
  const i = state.blocked.findIndex(([bx, by]) => bx === x && by === y);
  if (i >= 0) state.blocked.splice(i, 1); else state.blocked.push([x, y]);
  invalidate();
}

/* ---------- items ---------- */
/** Links an item row with its pieces on the board (-1: nothing). Mouse only: a tap would stick. */
function highlightRow(r) {
  $("#board").classList.toggle("focus", r >= 0);
  document.querySelectorAll("#board .cell[data-row]").forEach((c) => c.classList.toggle("hl", Number(c.dataset.row) === r));
  document.querySelectorAll("#rows tr.item").forEach((tr, i) => tr.classList.toggle("hl", i === r));
}

function renderPalette() {
  const btn = (t) => el("button", { class: "shape-btn", type: "button", "aria-label": `添加 ${t} 形物品`, onclick: () => addItem(t) },
    shapeSvg(t, 13), el("b", {}, t));
  $("#palette").replaceChildren(
    ...Object.keys(SHAPES).map(btn),
    ...customShapes.map((c) => el("div", { class: "custom" }, btn(c.name),
      el("button", { class: "x", type: "button", "aria-label": `删除自定义形状 ${c.name}`, onclick: () => deleteCustomShape(c.name) }, "×"))),
    el("button", { class: "shape-btn add", type: "button", "aria-label": "自定义形状", onclick: openShapeEditor },
      el("b", {}, "+"), el("small", {}, "自定义")));
}

/** Removes a shape from the palette; items already using it keep their own cells. */
function deleteCustomShape(name) {
  if (!confirm(`从形状栏删除自定义形状 ${name}？已添加的物品不受影响。`)) return;
  customShapes = customShapes.filter((c) => c.name !== name);
  saveCustomShapes();
  renderPalette();
}

let drawn = new Set(); // "x,y" cells picked in the editor
function openShapeEditor() {
  drawn = new Set();
  $("#drawErr").textContent = "";
  renderDrawGrid();
  $("#shapeEditor").showModal();
}
function renderDrawGrid() {
  const cells = [];
  for (let y = 0; y < DRAW_SIDE; y++) for (let x = 0; x < DRAW_SIDE; x++) {
    const k = `${x},${y}`;
    cells.push(el("button", { type: "button", "aria-label": `第 ${y + 1} 行第 ${x + 1} 列`, "aria-pressed": String(drawn.has(k)),
      onclick: () => { if (!drawn.delete(k)) drawn.add(k); renderDrawGrid(); } }));
  }
  $("#drawGrid").replaceChildren(...cells);
}
function submitShape(e) {
  e.preventDefault();
  const cells = [...drawn].map((k) => k.split(",").map(Number));
  if (cells.length === 0) { $("#drawErr").textContent = "请至少点选一个格子"; return; }
  if (!connected(cells)) { $("#drawErr").textContent = "格子要上下左右连在一起"; return; }
  $("#shapeEditor").close();
  const known = customShapes.length;
  const type = typeForShape(cells);
  renderPalette();
  addItem(type);
  setStatus(SHAPES[type] ? `这个形状就是内置的 ${type}，已按 ${type} 添加`
    : customShapes.length > known ? `已新建自定义形状 ${type} 并添加物品`
    : `这个形状和已有的 ${type} 相同，已按 ${type} 添加`, "ok");
}

/* ---------- preset groups: named item lists, kept in this browser ---------- */
const GROUP_STORE = "knapsack-groups-v1";
let groups = loadGroups();

function loadGroups() {
  try {
    const list = JSON.parse(localStorage.getItem(GROUP_STORE));
    if (Array.isArray(list)) return list.filter((g) => g && typeof g.name === "string" && Array.isArray(g.items));
  } catch (e) { /* fall through */ }
  return [];
}
function saveGroups() { localStorage.setItem(GROUP_STORE, JSON.stringify(groups)); renderGroups(); }
const copyItems = (items) => JSON.parse(JSON.stringify(items));

/** Saves the current item list under a name; an existing group of that name is replaced after asking. */
function saveGroup(name) {
  name = name.trim();
  if (!name) return setStatus("请先输入预设组名称", "err");
  if (state.items.length === 0) return setStatus("当前没有物品，无法保存", "err");
  const i = groups.findIndex((g) => g.name === name);
  if (i >= 0 && !confirm(`已有名为「${name}」的预设组，要覆盖吗？`)) return;
  const group = { name, items: copyItems(state.items) };
  if (i >= 0) groups[i] = group; else groups.push(group);
  saveGroups();
  $("#groupName").value = "";
  setStatus(`已保存预设组「${name}」`, "ok");
}

/** Replaces the current item list with a group's (after asking if the list isn't empty). */
function loadGroup(g) {
  if (state.items.length > 0 && !confirm(`用预设组「${g.name}」替换当前的物品列表吗？`)) return;
  state.items = upgrade({ items: copyItems(g.items) }).items;
  openRow = -1;
  invalidate();
  setStatus(`已载入预设组「${g.name}」`, "ok");
}

function renderGroups() {
  const list = $("#presets");
  if (groups.length === 0) {
    list.replaceChildren(el("p", { class: "empty-note" }, "填好物品后，输入组名并保存；以后点一下组名就能载入整组物品。"));
    return;
  }
  list.replaceChildren(...groups.map((g, i) => {
    const types = [...new Map(g.items.map((it) => [it.type, cellsOf(it)])).entries()].slice(0, 4);
    const count = g.items.reduce((s, it) => s + (it.qty || 1), 0);
    return el("div", {
      class: "preset", role: "button", tabindex: "0", title: `载入「${g.name}」`,
      onclick: () => loadGroup(g),
      onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loadGroup(g); } },
    },
    el("span", { class: "icons" }, ...types.map(([t, cells]) => shapeSvg(t, 6, cells))),
    el("span", {}, el("b", {}, g.name), el("small", {}, `${g.items.length} 种 · 共 ${count} 件`)),
    el("button", {
      class: "x", type: "button", "aria-label": `删除预设组「${g.name}」`,
      onclick: (e) => {
        e.stopPropagation();
        if (confirm(`删除预设组「${g.name}」？`)) { groups.splice(i, 1); saveGroups(); }
      },
    }, "×"));
  }));
}

function addItem(type) {
  const item = { type, name: "", perf: 0, qual: 0, eff: 0, border: [], adj: false, required: false, qty: 1 };
  if (!SHAPES[type]) item.cells = customCells(type);
  state.items.push(item);
  state.editing = true; // a new item needs its values typed in
  openRow = state.items.length - 1; // new items usually need their border/flags set
  invalidate();
  const rows = document.querySelectorAll("#rows tr.item");
  rows[rows.length - 1]?.querySelector("input[type=text]")?.focus();
}

let openRow = -1; // item whose settings panel is open (one at a time)

function renderRows() {
  const usedByRow = new Map();
  if (result) result.items.forEach((it) => {
    const r = resultRows[it.index];
    usedByRow.set(r, (usedByRow.get(r) || 0) + 1);
  });
  if (openRow >= state.items.length) openRow = -1;
  // final totals of each row's placed copies, per attribute
  const finalByRow = new Map();
  if (result) result.items.forEach((it) => {
    const r = resultRows[it.index], sum = finalByRow.get(r) || [0, 0, 0];
    finalByRow.set(r, sum.map((v, a) => v + it.values[a]));
  });
  // bars are scaled to the largest magnitude of each attribute in the list
  const scale = Object.fromEntries(ATTRS.map(([, , f]) => [f, Math.max(1, ...state.items.map((it) => Math.abs(it[f])))]));
  const rows = state.items.flatMap((it, r) => {
    const set = (k, parse = (v) => v) => (e) => { it[k] = parse(e.target.type === "checkbox" ? e.target.checked : e.target.value); invalidate(); };
    const open = r === openRow;
    const toggle = () => { openRow = open ? -1 : r; renderRows(); };
    const used = result ? usedByRow.get(r) || 0 : null;
    const sides = SIDES.filter(([side]) => it.border.includes(side)).map(([, label]) => label).join("");
    const tag = (cls, text) => el("button", { class: "chip-tag " + cls, type: "button", title: "设置边界、接收器、必选", onclick: toggle }, text);
    const bonusTags = [
      sides ? tag("side", `边 ${sides}`) : null,
      it.adj ? tag("", "接收器") : null,
      it.required ? tag("must", "必选") : null,
    ].filter(Boolean);
    const meta = [
      used == null ? null : el("span", { class: "used" + (used ? "" : " none") }, used ? `已用 ${used}/${it.qty}` : "未使用"),
      ...(bonusTags.length ? bonusTags : [tag("add", "+ 边界 / 接收器")]),
    ];
    const final = finalByRow.get(r);
    const locked = !state.editing;
    const main = el("tr", {
      class: "item" + (open ? " open" : "") + (used === 0 ? " unused" : "") + (locked ? " locked" : ""), style: `--row-color: ${rowColor(r)}`,
      // locked: a click anywhere on the row (but on its buttons) opens the bonuses
      onclick: (e) => { if (locked && !e.target.closest("button")) toggle(); },
      onpointerenter: (e) => { if (e.pointerType === "mouse") highlightRow(r); },
      onpointerleave: () => highlightRow(-1),
    },
      el("td", { class: "shape" }, el("div", { class: "type-pick" },
        el("button", { class: "shape-toggle", type: "button", title: "展开设置",
          "aria-label": `${it.name || it.type} 的设置`, "aria-expanded": String(open), onclick: toggle }, shapeSvg(it.type, 9, cellsOf(it))),
        typeSelect(it))),
      el("td", { class: "name" },
        el("input", { type: "text", value: it.name, placeholder: `${it.type}${r + 1}`, "aria-label": "名称", readonly: locked, tabindex: locked ? -1 : null, onchange: set("name") }),
        meta.length ? el("div", { class: "meta" }, ...meta) : null),
      ...ATTRS.map(([, label, field], a) => el("td", { class: "attr", "data-label": label },
        el("input", { type: "number", step: 1, value: it[field], "aria-label": label, readonly: locked, tabindex: locked ? -1 : null, onchange: set(field, toSigned) }),
        el("div", { class: "bar" + (it[field] < 0 ? " neg" : ""), style: `--w: ${(100 * Math.abs(it[field])) / scale[field]}%` }),
        final && (final[a] || it[field]) ? el("div", { class: "final" + (final[a] < 0 ? " neg" : ""), title: "求解后的最终值（含加成，同一行多件为合计）" }, `→ ${final[a]}`) : null)),
      el("td", { class: "attr", "data-label": "数量" }, el("input", { type: "number", min: 1, max: MAX_QTY, step: 1, value: it.qty, "aria-label": "数量", readonly: locked, tabindex: locked ? -1 : null, onchange: set("qty", (v) => Math.max(1, toInt(v))) })),
      el("td", { class: "more" },
        el("button", { class: "more-btn", type: "button", "aria-label": "加成设置：边界、接收器、必选", title: "边界、接收器、必选", "aria-expanded": String(open), onclick: toggle },
          "加成", el("span", { class: "chev", "aria-hidden": "true" }, "▾")),
        locked ? null : el("button", { class: "del", type: "button", "aria-label": `删除 ${it.name || it.type}`, title: "删除",
          onclick: () => { state.items.splice(r, 1); openRow = -1; invalidate(); } }, "×")));
    if (!open) return [main];
    return [main, el("tr", { class: "detail" }, el("td", { colspan: 7 }, settingsPanel(it)))];
  });
  $("#rows").replaceChildren(...rows);
  $("#emptyHint").hidden = rows.length > 0;
  $("#clearBtn").disabled = rows.length === 0;
  $("#editBtn").setAttribute("aria-pressed", String(state.editing));
  $("#editBtn").textContent = state.editing ? "✓ 完成编辑" : "✎ 编辑";
  const total = state.items.reduce((s, it) => s + it.qty, 0);
  $("#count").textContent = `${state.items.length} 种 · 共 ${total} 件`;
}

/** Shape picker of one item (built-in and custom shapes). */
function typeSelect(it) {
  const types = [...Object.keys(SHAPES), ...customShapes.map((c) => c.name)];
  if (!types.includes(it.type)) types.push(it.type); // custom shape deleted from the palette
  return el("select", { "aria-label": "形状", disabled: !state.editing, onchange: (e) => {
    const t = e.target.value;
    if (SHAPES[t]) delete it.cells; else it.cells = customCells(t) || it.cells;
    it.type = t;
    invalidate();
  } }, ...types.map((t) => el("option", { value: t, selected: t === it.type }, t)));
}

/** The bonus settings of one item: border sides, receiver, required. */
function settingsPanel(it) {
  const sides = el("div", { class: "sides row", role: "group", "aria-label": "边界奖励（可多选）" },
    ...SIDES.map(([side, label]) => el("button", {
      type: "button", "aria-pressed": String(it.border.includes(side)), "aria-label": `${label}边界`,
      onclick: () => {
        it.border = it.border.includes(side) ? it.border.filter((b) => b !== side)
          : [...it.border.filter((b) => b !== OPPOSITE[side]), side];
        invalidate();
      },
    }, label)));
  const check = (key, text) => el("label", { class: "field check" },
    el("input", { type: "checkbox", checked: it[key], onchange: (e) => { it[key] = e.target.checked; invalidate(); } }), text);
  return el("div", { class: "settings" },
    el("div", { class: "field" }, el("span", {}, "边界"), sides, el("small", {}, "每边 +20%")),
    check("adj", "接收器"),
    check("required", "必选"));
}

function toInt(v) { const n = Math.floor(Number(v)); return Number.isFinite(n) && n >= 0 ? n : 0; }
function toSigned(v) { const n = Math.trunc(Number(v)); return Number.isFinite(n) ? n : 0; }
const maxAttr = (goal) => goal.indexOf("max");

/* ---------- goal ---------- */
function renderGoal() {
  const goal = state.goal;
  const setMode = (a, mode) => {
    if (mode === "max") {
      const prev = maxAttr(goal);
      if (prev >= 0 && prev !== a) goal[prev] = "skip"; // at most one maximized attribute
      goal[a] = "max";
    } else if (mode === "target") {
      if (typeof goal[a] !== "number") goal[a] = 0;
    } else {
      goal[a] = "skip";
    }
    invalidate();
  };
  $("#goal").replaceChildren(...ATTRS.map(([, label], a) => {
    const mode = goal[a] === "max" ? "max" : goal[a] === "skip" ? "skip" : "target";
    const seg = el("div", { class: "seg", role: "radiogroup", "aria-label": `${label}目标` },
      ...[["max", "求最大"], ["target", "达标"], ["skip", "跳过"]].map(([m, text]) =>
        el("button", { type: "button", "aria-pressed": String(mode === m), onclick: () => setMode(a, m) }, text)));
    const target = mode === "target"
      ? el("label", {}, "≥ ", el("input", { type: "number", step: 1, value: goal[a], "aria-label": `${label}达标值`,
          onchange: (e) => { goal[a] = toSigned(e.target.value); invalidate(); } }))
      : null;
    return el("div", { class: "goal-row" }, el("b", {}, label), seg, target);
  }), ...goalNotes(goal));
}

function goalNotes(goal) {
  const notes = [];
  if (maxAttr(goal) < 0) notes.push("未设求最大：在满足达标条件的前提下，让占用的格子最少（特殊矩形也算占用）。");
  const targets = goal.filter((g) => typeof g === "number").length;
  if (state.fast) {
    notes.push("快速模式：几秒内给出近似解，不保证最优；关闭后求精确最优解。");
    return notes.map((t) => el("p", { class: "goal-note" }, t));
  }
  if (targets >= 2) {
    notes.push("同时设了多个达标条件：计算量会成倍增加，常常超出浏览器内存。建议先只保留一个达标条件（其余跳过），或打开快速模式。");
  } else if (targets === 1) {
    notes.push("达标条件较紧时可能需要较长时间（几分钟以上），可以随时取消，或适当调低目标。");
  }
  const negative = ATTRS.some(([, , field], a) => goal[a] !== "skip" && state.items.some((it) => it[field] < 0));
  if (negative && targets > 0) notes.push("参与计算的属性里有负值，求解会明显变慢。");
  return notes.map((t) => el("p", { class: "goal-note" }, t));
}

/* ---------- result ---------- */
function renderResult() {
  const total = $("#total");
  total.hidden = !result;
  if (!result) { $("#breakdown").replaceChildren(); return; }
  if (!result.feasible) {
    const inf = result.infeasible;
    if (inf.notFound) {
      total.replaceChildren(el("div", { class: "infeasible" },
        "快速模式没有找到满足所有条件的方案（不代表一定无解）。可以调低目标，或关闭快速模式求精确解。"));
      $("#breakdown").replaceChildren();
      return;
    }
    const reasons = inf.requiredImpossible
      ? [el("li", {}, "必选物品无法同时放进棋盘")]
      : inf.targetBest.map((t) => el("li", {}, `${ATTRS[t.attr][1]}目标 ≥ ${t.target}，单独最多只能到 ${t.best}`));
    total.replaceChildren(el("div", { class: "infeasible" },
      "无法满足所有条件（已证明不存在满足条件的摆法）：", el("ul", {}, ...reasons),
      inf.targetBest.length > 1 ? "多个目标单独都可达时，说明它们无法同时满足，可以适当调低目标。" : null));
    $("#breakdown").replaceChildren();
    return;
  }
  const goal = resultGoal;
  const main = maxAttr(goal);
  const order = main < 0 ? [0, 1, 2] : [main, ...[0, 1, 2].filter((a) => a !== main)];
  const emptyCells = main < 0
    ? el("span", { class: "main" }, el("span", { class: "num" }, String(result.emptyCells)), el("span", { class: "lbl" }, "空格 · 最多"))
    : null;
  total.replaceChildren(
    el("div", { class: "totals" }, emptyCells, ...order.map((a) => {
      const g = goal[a];
      return el("span", { class: (a === main ? "main" : "sub") + (g === "skip" ? " skip" : "") },
        el("span", { class: "num" }, String(result.totals[a])),
        el("span", { class: "lbl" }, ATTRS[a][1] + (a === main ? " · 最大" : "")),
        typeof g === "number" ? el("span", { class: "met" }, `✓ ≥ ${g}`) : null);
    })),
    el("span", { class: "proof" + (result.approximate ? " approx" : "") }, result.approximate
      ? `近似解 · 未证明最优 · ${result.seconds.toFixed(1)}s` + (result.itemsConsidered < result.itemsGiven ? ` · 考虑了 ${result.itemsConsidered} 件` : "")
      : `已证明最优 · ${result.seconds.toFixed(1)}s · ${result.rounds} 轮`));
  const cell = (a, v, base) => el("td", { class: "num" + (goal[a] === "skip" ? " skip" : "") },
    String(v), base != null && base !== v ? el("span", { class: "base" }, `(${base})`) : null);
  const bonusCell = (b) => el("td", { class: "num bonus" }, b.pct ? `+${b.pct}%` : "—", b.text ? el("small", {}, b.text) : null);
  const itemRows = [...result.items].sort((a, b) => b.values[order[0]] - a.values[order[0]]).map((it) =>
    el("tr", {},
      el("td", {}, el("span", { class: "chip", style: `background:${rowColor(resultRows[it.index])}` }), it.name),
      bonusCell(bonusOf(it)),
      ...order.map((a) => cell(a, it.values[a], it.base[a]))));
  const pieceSum = (a) => result.pieces.reduce((s, p) => s + p.values[a], 0);
  const pieceRow = el("tr", {},
    el("td", {}, el("span", { class: "chip", style: "background:repeating-linear-gradient(-45deg,#ece4d4 0 3px,#cbbfa8 3px 6px)" }), `特殊矩形 ×${result.pieces.length}`),
    el("td", {}),
    ...order.map((a) => cell(a, pieceSum(a), null)));
  $("#breakdown").replaceChildren(el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "物品（括号内为基础值）"), el("th", { class: "num" }, "加成"),
      ...order.map((a) => el("th", { class: "num" }, ATTRS[a][1])))),
    el("tbody", {}, ...itemRows, pieceRow)));
}

function render() {
  $("#w").value = state.width;
  $("#h").value = state.height;
  const boardLocked = !!result && !boardEdit;
  $("#board").classList.toggle("locked", boardLocked);
  $("#boardHint").hidden = !!result; // with a result the button below says it all
  $("#boardEditBtn").hidden = !result;
  $("#boardEditBtn").setAttribute("aria-pressed", String(boardEdit));
  $("#boardEditBtn").textContent = boardEdit ? "✓ 完成" : "✎ 修改禁用格";
  $("#fastMode").checked = state.fast;
  if (!solving) $("#solveBtn").textContent = solveLabel();
  renderBoard();
  renderGoal();
  renderRows();
  renderResult();
}

/* ---------- solve / io ---------- */
function buildRequest() {
  const items = [], rows = [];
  state.items.forEach((it, r) => {
    const base = it.name.trim() || `${it.type}${r + 1}`;
    for (let k = 0; k < it.qty; k++) {
      const item = {
        name: it.qty > 1 ? `${base}#${k + 1}` : base,
        ...(SHAPES[it.type] ? { type: it.type } : { shape: it.cells }),
        performance: it.perf, quality: it.qual, efficiency: it.eff, adjBonus: it.adj,
      };
      if (it.border.length) item.border = it.border.length === 1 ? it.border[0] : it.border;
      if (it.required) item.required = true;
      items.push(item);
      rows.push(r);
    }
  });
  const goal = Object.fromEntries(ATTRS.map(([name], a) => [name, state.goal[a]]));
  const request = { width: state.width, height: state.height, blocked: state.blocked, goal, items };
  request.mode = state.fast ? "fast" : "exact";
  return { request, rows };
}

function setStatus(text, kind = "") {
  const s = $("#status");
  s.textContent = text;
  s.className = "status" + (kind ? " " + kind : "");
}

// Starting the engine downloads the WASM and spawns one worker per core, each fetching its own
// scripts: dozens of requests that take seconds over a real network. So it is started as soon as
// the page loads and reused across solves.
const ENGINE_MEMORY_LIMIT = 1 << 30; // WASM memory never shrinks: recycle the engine after big solves
function startEngine() {
  if (engine) return engine;
  engine = new Worker(new URL("./solver.worker.js", import.meta.url), { type: "module" });
  // optional ?threads=N caps the CPU cores used (default: all)
  const threads = Number(new URLSearchParams(location.search).get("threads")) || undefined;
  engine.postMessage({ type: "init", threads });
  return engine;
}
function stopEngine() {
  engine?.terminate(); // also ends the thread pool
  engine = null;
}

const solveLabel = () => (state.fast ? "快速求解" : "求最优解");

function solve() {
  if (solving) return cancelSolve();
  const { request, rows } = buildRequest();
  if (request.items.length === 0) return setStatus("请先添加物品", "err");
  if (request.items.length > MAX_ITEMS) return setStatus(`物品最多 ${MAX_ITEMS} 件`, "err");
  const btn = $("#solveBtn");
  btn.textContent = "取消";
  btn.classList.add("cancel");
  solving = true;
  const t0 = performance.now();
  let progress = "· 准备计算引擎";
  const hasTargets = state.goal.some((g) => typeof g === "number");
  const tick = () => {
    const secs = (performance.now() - t0) / 1000;
    const hint = !state.fast && hasTargets && secs > 15 ? " · 条件较紧，可以取消后改用快速模式" : "";
    setStatus(`求解中… ${secs.toFixed(0)}s ${progress}${hint}`);
  };
  const timer = setInterval(tick, 250);
  tick();
  const finish = (text, kind, keepEngine) => {
    clearInterval(timer);
    solving = false;
    if (!keepEngine) stopEngine();
    btn.textContent = solveLabel();
    btn.classList.remove("cancel");
    setStatus(text, kind);
    if (!engine) startEngine(); // warm a fresh one for next time
  };
  cancelSolve = () => finish("已取消", "", false);
  const worker = startEngine();
  worker.onmessage = ({ data }) => {
    if (data.type === "progress") {
      progress = `· 第 ${data.round} 轮 ${Math.round((100 * (data.pos + 1)) / data.cells)}%`;
    } else if (data.type === "done") {
      result = data.result;
      result.seconds = (performance.now() - t0) / 1000; // what the user waited, startup included
      result.itemsGiven = request.items.length;
      resultRows = rows;
      resultGoal = [...state.goal];
      solvedState = JSON.stringify(state);
      boardEdit = false;
      const failed = result.infeasible?.notFound ? "未找到" : "无法达标";
      finish(result.feasible ? "完成" : failed, result.feasible ? "ok" : "err", data.memoryBytes < ENGINE_MEMORY_LIMIT);
      render();
    } else {
      finish("出错：" + data.message, "err", false);
    }
  };
  worker.onerror = (e) => finish("出错：" + (e.message || "求解线程崩溃（可能是内存不足）"), "err", false);
  worker.postMessage({ type: "solve", problem: request });
}
let cancelSolve = () => {};

function exportJson() {
  const blob = new Blob([JSON.stringify(buildRequest().request, null, 2)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "knapsack.json" });
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJson(text) {
  const p = JSON.parse(text);
  if (!Number.isInteger(p.width) || !Number.isInteger(p.height) || !Array.isArray(p.items)) throw new Error("缺少 width/height/items");
  const items = p.items.map((it) => {
    let type = it.type;
    if (type && !SHAPES[type]) throw new Error(`物品 ${it.name} 的 type「${type}」不是内置形状`);
    if (!type) {
      const ok = Array.isArray(it.shape) && it.shape.length > 0
        && it.shape.every((c) => Array.isArray(c) && c.length === 2 && c.every(Number.isInteger));
      if (!ok || !connected(it.shape)) throw new Error(`物品 ${it.name} 缺少 type，或 shape 不是连在一起的格子`);
      type = typeForShape(it.shape);
    }
    return {
      type, ...(SHAPES[type] ? {} : { cells: customCells(type) }), name: it.name || "", perf: toSigned(it.performance ?? it.value), qual: toSigned(it.quality),
      eff: toSigned(it.efficiency), border: toSides(it.border), adj: !!it.adjBonus, required: !!it.required, qty: 1,
    };
  });
  const goal = ATTRS.map(([name], a) => p.goal?.[name] ?? (a === 0 ? "max" : "skip"));
  if (goal.filter((g) => g === "max").length > 1) throw new Error("goal 里最多只能有一个属性是 \"max\"");
  state = { width: p.width, height: p.height, blocked: p.blocked || [], items, goal, fast: p.mode !== "exact" };
  renderPalette();
  invalidate();
}

function setDim(key, input) {
  const v = Math.min(MAX_SIDE, Math.max(1, toInt(input.value) || 1));
  const cornersOnly = sameCells(state.blocked, corners(state.width, state.height));
  state[key] = v;
  state.blocked = cornersOnly ? corners(state.width, state.height)   // untouched default follows the resize
    : state.blocked.filter(([x, y]) => x < state.width && y < state.height);
  invalidate();
}

async function init() {
  renderPalette();
  renderGroups();
  $("#shapeForm").addEventListener("submit", submitShape);
  $("#drawCancel").addEventListener("click", () => $("#shapeEditor").close());
  $("#groupSave").addEventListener("submit", (e) => { e.preventDefault(); saveGroup($("#groupName").value); });
  $("#w").addEventListener("change", (e) => setDim("width", e.target));
  $("#h").addEventListener("change", (e) => setDim("height", e.target));
  $("#solveBtn").addEventListener("click", solve);
  $("#fastMode").addEventListener("change", (e) => { state.fast = e.target.checked; save(); render(); });
  $("#boardEditBtn").addEventListener("click", () => { boardEdit = !boardEdit; render(); });
  $("#editBtn").addEventListener("click", (e) => {
    e.preventDefault(); // inside <summary>: don't fold the list
    state.editing = !state.editing;
    if (state.editing) $("#itemList").open = true; // nothing to edit in a folded list
    save(); renderRows();
  });
  $("#clearBtn").addEventListener("click", () => {
    if (!confirm(`清空全部 ${state.items.length} 种物品？（预设组不受影响）`)) return;
    state.items = [];
    openRow = -1;
    $("#itemList").open = true;
    invalidate();
    setStatus("已清空物品", "ok");
  });
  $("#exportBtn").addEventListener("click", exportJson);
  $("#importBtn").addEventListener("click", () => $("#importFile").click());
  $("#importFile").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try { importJson(await f.text()); setStatus("已导入", "ok"); }
    catch (err) { setStatus("导入失败：" + err.message, "err"); }
  });
  render();
  startEngine();
}
init().catch((e) => setStatus("初始化失败：" + e.message, "err"));
</script>
</body>
