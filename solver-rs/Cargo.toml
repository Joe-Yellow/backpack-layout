[package]
name = "backpack-solver"
version = "0.1.0"
edition = "2021"
description = "Exact, provably optimal 2D backpack layout solver (native + WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
smallvec = { version = "1.13", features = ["const_generics", "union"] }
rustc-hash = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
